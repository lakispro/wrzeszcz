<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wrzeszcz Dolny w fotografii</title>
<meta name="description" content="Zdjęcia budynków i otoczenia Wrzeszcza Dolnego (Langfuhr) w Gdańsku — z opisami, datami i źródłami.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f5f2ec;--panel:#fffdf9;--ink:#1f1c18;--mute:#6b645a;--line:#e2dccf;--acc:#8a3b12;--chip:#ece6da;--old:#7a5a2f;--prl:#355c7d;--new:#2f6b4f}
@media (prefers-color-scheme:dark){:root{--bg:#16140f;--panel:#1f1c17;--ink:#ece6da;--mute:#a59d90;--line:#332e26;--acc:#e08a52;--chip:#2a261f;--old:#d2a86a;--prl:#86afd4;--new:#7dc3a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:28px 16px 8px;max-width:1400px;margin:auto}
h1{font:600 clamp(26px,4vw,40px)/1.1 Georgia,serif;margin:0 0 6px}
h1 small{display:block;font:italic 400 .5em Georgia,serif;color:var(--mute);margin-top:4px}
.lead{color:var(--mute);max-width:820px;margin:8px 0 0}
.bar{position:sticky;top:0;z-index:500;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1400px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{flex:1 1 220px;min-width:0}
select{max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--mute);font-size:13px;margin-left:auto}
main{max-width:1400px;margin:auto;padding:12px 16px 40px}
#map{height:340px;border-radius:12px;border:1px solid var(--line);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .img{aspect-ratio:4/3;background:var(--chip);overflow:hidden;position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .noimg{display:flex;height:100%;align-items:center;justify-content:center;padding:16px;text-align:center;color:var(--mute);font-size:13px}
.yr{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.66);color:#fff;font-size:12px;padding:2px 8px;border-radius:99px}
.card .t{padding:9px 11px 11px}
.card h3{font-size:14px;margin:0 0 3px;line-height:1.3}
.card p{margin:0;font-size:12px;color:var(--mute)}
.era-old{color:var(--old)}.era-prl{color:var(--prl)}.era-new{color:var(--new)}
.more{display:block;margin:20px auto;font:inherit;padding:9px 20px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:inherit;cursor:pointer}
dialog{border:0;padding:0;max-width:min(1100px,96vw);width:100%;background:var(--panel);color:var(--ink);border-radius:14px}
dialog::backdrop{background:rgba(0,0,0,.75)}
.lb{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,2fr)}
.lb .pic{background:#000;display:flex;align-items:center;justify-content:center;min-height:300px}
.lb .pic img{max-width:100%;max-height:82vh;display:block}
.lb .info{padding:18px 20px;overflow:auto;max-height:86vh}
.lb h2{font:600 20px/1.25 Georgia,serif;margin:0 0 8px}
.lb dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:12px 0}
.lb dt{color:var(--mute)}.lb dd{margin:0;overflow-wrap:anywhere}
.lb a{color:var(--acc)}
.note{font-size:13px;background:var(--chip);border-radius:8px;padding:9px 11px}
.x{position:absolute;right:10px;top:8px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:99px;width:34px;height:34px;font-size:18px;cursor:pointer;z-index:2}
.nav{display:flex;gap:8px;margin-top:14px}.nav button{flex:1;font:inherit;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:inherit;cursor:pointer}
footer{max-width:1400px;margin:auto;padding:20px 16px 50px;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}
footer a{color:var(--acc)}
@media (max-width:760px){.lb{grid-template-columns:1fr}.lb .pic img{max-height:55vh}#map{height:240px}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}}
</style>
</head>
<body>
<header>
  <h1>Wrzeszcz Dolny w fotografii<small>Langfuhr · Kolonia · Kuźniczki · Nowe Szkoty</small></h1>
  <p class="lead">Zebrane z sieci zdjęcia budynków, ulic i otoczenia dzielnicy Wrzeszcz Dolny w Gdańsku — od pocztówek z czasów pruskich po dziś. Każde zdjęcie ma datę (jeśli znana), opis i link do źródła. Kliknij kartę, aby zobaczyć szczegóły.</p>
</header>
<div class="bar"><div class="bar-in">
  <input type="search" id="q" placeholder="Szukaj: ulica, budynek, rok, niem. nazwa…">
  <select id="street"><option value="">Wszystkie miejsca</option></select>
  <div class="chips" id="eras">
    <button class="chip" data-era="" aria-pressed="true">Wszystkie</button>
    <button class="chip" data-era="old" aria-pressed="false">do 1945</button>
    <button class="chip" data-era="prl" aria-pressed="false">1945–1989</button>
    <button class="chip" data-era="new" aria-pressed="false">po 1989</button>
  </div>
  <select id="sort"><option value="yr">Najstarsze</option><option value="yrd">Najnowsze</option><option value="place">Wg miejsca</option></select>
  <span class="count" id="count"></span>
</div></div>
<main>
  <div id="map"></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Pokaż więcej</button>
</main>
<footer id="foot"></footer>
<dialog id="dlg"><div style="position:relative"><button class="x" id="x" aria-label="Zamknij">✕</button><div class="lb" id="lb"></div></div></dialog>
<script>
const $=s=>document.querySelector(s);
const ERA={old:'do 1945',prl:'1945–1989',new:'po 1989','':'data nieznana'};
let ALL=[],view=[],shown=0,cur=-1,era='',map,layer;
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data.json').then(r=>r.json()).then(d=>{
  ALL=d.items;
  const st=[...new Set(ALL.map(i=>i.street).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
  $('#street').insertAdjacentHTML('beforeend',st.map(s=>`<option>${esc(s)}</option>`).join(''));
  const src={};ALL.forEach(i=>src[i.source]=(src[i.source]||0)+1);
  $('#foot').innerHTML=`<p><b>${ALL.length}</b> zdjęć. Źródła: ${Object.entries(src).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k)} (${v})`).join(', ')}.</p>
  <p>Zdjęcia pozostają własnością autorów i instytucji. Pliki z Wikimedia Commons wyświetlane są zgodnie z ich licencjami (autor i licencja przy każdym zdjęciu). Zdjęcia z innych serwisów pokazane są jako miniatura lub odnośnik — pełna wersja i prawa w źródle. Granice dzielnicy wg OpenStreetMap (statut dzielnicy Wrzeszcz Dolny). Zebrano: ${esc(d.generated)}.</p>`;
  initMap();apply();
  const h=location.hash.slice(1);if(h){const k=view.findIndex(i=>i.id===h);if(k>=0)open(k)}
});
function initMap(){
  map=L.map('map',{scrollWheelZoom:false}).setView([54.386,18.618],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  fetch('boundary.geojson').then(r=>r.json()).then(g=>L.geoJSON(g,{style:{color:'#8a3b12',weight:2,fill:false,dashArray:'5 4'}}).addTo(map)).catch(()=>{});
  layer=L.layerGroup().addTo(map);
}
function apply(){
  const q=$('#q').value.trim().toLowerCase(),s=$('#street').value,so=$('#sort').value;
  view=ALL.filter(i=>(!era||i.era===era)&&(!s||i.street===s)&&(!q||(i.title+' '+i.place+' '+i.desc+' '+(i.note||'')+' '+i.year+' '+i.street+' '+(i.de||'')).toLowerCase().includes(q)));
  const ys=i=>i.ys??9999;
  if(so==='yr')view.sort((a,b)=>ys(a)-ys(b));
  else if(so==='yrd')view.sort((a,b)=>(b.ys??-1)-(a.ys??-1));
  else view.sort((a,b)=>(a.street||'~').localeCompare(b.street||'~','pl')||ys(a)-ys(b));
  $('#count').textContent=`${view.length} / ${ALL.length}`;
  $('#grid').innerHTML='';shown=0;more();
  layer.clearLayers();
  view.forEach((i,k)=>{if(i.lat!=null){L.circleMarker([i.lat,i.lon],{radius:5,weight:1,color:'#fff',fillColor:i.era==='old'?'#a06a2c':i.era==='prl'?'#355c7d':'#2f6b4f',fillOpacity:.9}).bindTooltip(esc(i.title)).on('click',()=>open(k)).addTo(layer)}});
}
function card(i,k){
  const im=i.thumb?`<img loading="lazy" src="${esc(i.thumb)}" alt="${esc(i.title)}" referrerpolicy="no-referrer" data-full="${esc(i.full||'')}" onerror="if(this.dataset.full&&this.src!==this.dataset.full){this.src=this.dataset.full}else{this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'Podgląd niedostępny — otwórz źródło'}))}">`:`<div class="noimg">Zdjęcie w źródle:<br>${esc(i.source)}</div>`;
  return `<article class="card" data-k="${k}"><div class="img">${im}${i.year?`<span class="yr">${esc(i.year)}</span>`:''}</div><div class="t"><h3>${esc(i.title)}</h3><p><span class="era-${i.era}">●</span> ${esc(i.place||i.street||'')}</p></div></article>`;
}
function more(){
  const n=Math.min(view.length,shown+60);
  $('#grid').insertAdjacentHTML('beforeend',view.slice(shown,n).map((i,j)=>card(i,shown+j)).join(''));
  shown=n;$('#more').hidden=shown>=view.length;
}
function open(k){
  cur=k;const i=view[k];
  const pic=i.full||i.thumb;
  $('#lb').innerHTML=`<div class="pic">${pic?`<img src="${esc(pic)}" alt="${esc(i.title)}" referrerpolicy="no-referrer">`:`<a href="${esc(i.page)}" target="_blank" rel="noopener" style="color:#fff;padding:30px">Otwórz zdjęcie w źródle ↗</a>`}</div>
  <div class="info"><h2>${esc(i.title)}</h2>
  ${i.desc?`<p>${esc(i.desc)}</p>`:''}
  ${i.note?`<p class="note"><b>O miejscu:</b> ${esc(i.note)}</p>`:''}
  <dl>
   <dt>Data</dt><dd>${esc(i.year||'nieznana')} <span class="era-${i.era}">(${ERA[i.era]})</span></dd>
   <dt>Miejsce</dt><dd>${esc(i.place||'—')}${i.de?`<br><i>${esc(i.de)}</i>`:''}</dd>
   ${i.author?`<dt>Autor</dt><dd>${esc(i.author)}</dd>`:''}
   <dt>Licencja</dt><dd>${esc(i.license||'—')}</dd>
   <dt>Źródło</dt><dd><a href="${esc(i.page)}" target="_blank" rel="noopener">${esc(i.source)} ↗</a></dd>
   ${i.lat!=null?`<dt>Mapa</dt><dd><a href="https://www.openstreetmap.org/?mlat=${i.lat}&mlon=${i.lon}#map=18/${i.lat}/${i.lon}" target="_blank" rel="noopener">${i.lat.toFixed(5)}, ${i.lon.toFixed(5)}</a></dd>`:''}
  </dl>
  <div class="nav"><button id="pv">← Poprzednie</button><button id="nx">Następne →</button></div></div>`;
  $('#pv').onclick=()=>open((cur-1+view.length)%view.length);
  $('#nx').onclick=()=>open((cur+1)%view.length);
  history.replaceState(null,'','#'+i.id);
  if(!$('#dlg').open)$('#dlg').showModal();
}
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)open(+c.dataset.k)};
$('#more').onclick=more;
$('#x').onclick=()=>$('#dlg').close();
$('#dlg').addEventListener('close',()=>history.replaceState(null,'',location.pathname));
$('#dlg').onclick=e=>{if(e.target===$('#dlg'))$('#dlg').close()};
document.addEventListener('keydown',e=>{if(!$('#dlg').open)return;if(e.key==='ArrowRight')$('#nx').click();if(e.key==='ArrowLeft')$('#pv').click()});
let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(apply,200)};
$('#street').onchange=apply;$('#sort').onchange=apply;
$('#eras').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;era=b.dataset.era;document.querySelectorAll('#eras .chip').forEach(c=>c.setAttribute('aria-pressed',c===b));apply()};
</script>
</body>
</html>
